<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Profile header">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#EADFCB"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#CBB594" opacity=".55"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="card"><rect width="1000" height="300" rx="28"/></clipPath>
<clipPath id="nameclip"><rect x="40" y="86" width="0" height="104"><animate attributeName="width" values="0;760" keyTimes="0;1" calcMode="spline" keySplines=".2 .7 .2 1" dur="1.6s" begin="0.2s" fill="freeze"/></rect></clipPath>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#FAF6EE" stop-opacity="0"/><stop offset=".5" stop-color="#FAF6EE" stop-opacity="1"/><stop offset="1" stop-color="#FAF6EE" stop-opacity="0"/></linearGradient>
<clipPath id="barclip"><rect x="48" y="190" width="470" height="4" rx="2"/></clipPath>
</defs>

<g clip-path="url(#card)">
<rect width="1000" height="300" fill="url(#bg)"/>
<g filter="url(#blur)">
  <circle cx="830" cy="60" r="120" fill="#E0CDAE" opacity=".8"><animate attributeName="cx" values="830;790;830" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="60;100;60" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="300" r="120" fill="#D8C3A0" opacity=".55"><animate attributeName="cx" values="120;180;120" dur="13s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="320" r="90" fill="#EFE3CF"><animate attributeName="cy" values="320;265;320" dur="10s" repeatCount="indefinite"/></circle>
</g>
<rect width="1000" height="300" fill="url(#dots)"/>

<!-- orbit system -->
<circle cx="830" cy="150" r="112" fill="none" stroke="#CBB594" stroke-width="1" opacity=".8"/>
<circle cx="830" cy="150" r="80" fill="none" stroke="#9A7653" stroke-width="1.4" stroke-dasharray="3 9" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="360 830 150" to="0 830 150" dur="30s" repeatCount="indefinite"/></circle>
<circle cx="830" cy="150" r="54" fill="none" stroke="#CBB594" stroke-width="1.4" stroke-dasharray="1 7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="22s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="16s" repeatCount="indefinite"/><circle cx="942" cy="150" r="12" fill="#9A7653" opacity=".18"/><circle cx="942" cy="150" r="6" fill="#9A7653"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="140 830 150" to="500 830 150" dur="24s" repeatCount="indefinite"/><circle cx="750" cy="150" r="4.5" fill="#2E2822"/></g>
<circle cx="830" cy="150" r="32" fill="#2E2822"><animate attributeName="r" values="32;35;32" dur="3.5s" repeatCount="indefinite"/></circle>
<text x="830" y="157" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#F4EDE1">&lt;/&gt;</text>

<!-- copy -->
<text x="52" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="2" fill="#9A7653" opacity="0">hello, world. i'm<animate attributeName="opacity" values="0;1" dur=".9s" begin=".1s" fill="freeze"/></text>
<text x="46" y="160" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="68" font-weight="700" letter-spacing="-1" fill="#2E2822" clip-path="url(#nameclip)">Your Name</text>
<g clip-path="url(#barclip)">
  <rect x="48" y="190" width="470" height="4" fill="#CBB594" opacity=".55"/>
  <rect x="48" y="190" width="96" height="4" fill="#9A7653"/>
  <rect x="-100" y="190" width="150" height="4" fill="url(#shine)"><animateTransform attributeName="transform" type="translate" from="0 0" to="680 0" dur="3.4s" repeatCount="indefinite"/></rect>
</g>
<text x="52" y="226" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3" fill="#6B5E50">FIRST-YEAR  ·  FULL-STACK  ·  BUILDING IN PUBLIC</text>
<rect x="48" y="248" width="318" height="32" rx="16" fill="#FAF6EE" stroke="#E0D3BE"/>
<circle cx="70" cy="264" r="5" fill="#9A7653"/>
<circle cx="70" cy="264" r="5" fill="none" stroke="#9A7653" stroke-width="1.5"><animate attributeName="r" values="5;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="88" y="269" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B5E50">learning in public · open to collabs</text>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="28" fill="none" stroke="#E0D3BE"/>

</svg>
