<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-style="italic" font-size="38" fill="#2E2822" opacity="0">Consistency beats perfection.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.00000;0.03158;0.16842;0.20000;1.00000" dur="19.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -6" keyTimes="0;.05;.9;1" dur="3.8s" begin="0.0s" repeatCount="indefinite" additive="sum"/></text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-style="italic" font-size="38" fill="#2E2822" opacity="0">Small commits, big momentum.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.20000;0.23158;0.36842;0.40000;1.00000" dur="19.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -6" keyTimes="0;.05;.9;1" dur="3.8s" begin="3.8s" repeatCount="indefinite" additive="sum"/></text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-style="italic" font-size="38" fill="#2E2822" opacity="0">Ship it. Then make it better.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.40000;0.43158;0.56842;0.60000;1.00000" dur="19.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -6" keyTimes="0;.05;.9;1" dur="3.8s" begin="7.6s" repeatCount="indefinite" additive="sum"/></text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-style="italic" font-size="38" fill="#2E2822" opacity="0">Every expert was once a beginner.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.60000;0.63158;0.76842;0.80000;1.00000" dur="19.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -6" keyTimes="0;.05;.9;1" dur="3.8s" begin="11.399999999999999s" repeatCount="indefinite" additive="sum"/></text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-style="italic" font-size="38" fill="#2E2822" opacity="0">Break it. Fix it. Understand it.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.80000;0.83158;0.96842;1.00000" dur="19.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 -6" keyTimes="0;.05;.9;1" dur="3.8s" begin="15.2s" repeatCount="indefinite" additive="sum"/></text>

